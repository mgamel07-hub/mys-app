<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#DDF2EC">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<title>ساعتي الذكية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Lalezar&family=Noto+Naskh+Arabic:wght@500;700&display=swap">
<style>
/* Layout: a classroom wall clock is the hero of every screen; the two hands carry the two colors used everywhere (berry = hour, blue = minute), so color itself teaches which hand is which. Deliberately a single bright look for young children. */
:root{
  color-scheme: light;
  --wall:#DDF2EC; --wall2:#C6E8DF; --paper:#FFFFFF; --ink:#1F3446; --muted:#5B7183; --line:#BFDCD3;
  --hour:#DE4677; --hour-d:#B02E5A; --min:#2F7DD1; --min-d:#1F5DA3;
  --sun:#FFB627; --sun-d:#D28C05; --leaf:#2E9E6A; --leaf-d:#1F7A50; --bad:#D9483B; --hl:#FFE7A3;
  --f-display:'Lalezar','Baloo Bhaijaan 2','Segoe UI',Tahoma,sans-serif;
  --f-ui:'Baloo Bhaijaan 2','Segoe UI',Tahoma,Arial,sans-serif;
  --f-read:'Noto Naskh Arabic','Traditional Arabic','Times New Roman',serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--wall);color:var(--ink);font-family:var(--f-ui);font-size:17px;direction:rtl;overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--min);outline-offset:3px}
#app{height:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-display);font-size:26px;flex:1;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .h{color:var(--hour-d)}.brand .m{color:var(--min-d)}
.iconbtn{width:48px;height:48px;border-radius:16px;background:var(--paper);box-shadow:0 4px 0 var(--line);display:grid;place-items:center;font-size:22px;flex:none}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.stars{display:flex;align-items:center;gap:6px;background:var(--paper);border-radius:999px;padding:6px 14px 6px 10px;box-shadow:0 4px 0 var(--line);font-weight:800;font-size:20px}
.stars b{color:var(--sun);font-size:22px}
.stars.bump{animation:bump .5s}@keyframes bump{40%{transform:scale(1.25)}}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:4px 30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h2.t{font-family:var(--f-display);font-weight:400;font-size:28px;margin:6px 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 14px;line-height:1.7}
.note{color:var(--muted);font-size:14px;line-height:1.8}

.block{--c:var(--leaf);--d:var(--leaf-d);background:var(--c);color:#fff;border-radius:20px;box-shadow:0 6px 0 var(--d);transition:transform .08s,box-shadow .08s}
.block:active{transform:translateY(4px);box-shadow:0 2px 0 var(--d)}
.c-hour{--c:var(--hour);--d:var(--hour-d)}.c-min{--c:var(--min);--d:var(--min-d)}.c-sun{--c:var(--sun);--d:var(--sun-d);color:#2B2410}.c-leaf{--c:var(--leaf);--d:var(--leaf-d)}
.c-ghost{--c:var(--paper);--d:var(--line);color:var(--ink)}
.btn{padding:10px 20px;font-size:19px;font-weight:800;min-height:54px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row.center{justify-content:center}
.card{background:var(--paper);border-radius:28px;box-shadow:0 7px 0 var(--line);padding:18px 16px;text-align:center}

/* clock */
.clock{display:block;margin:0 auto;max-width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.clock .face{fill:var(--paper);stroke:var(--ink);stroke-width:5}
.clock .rim{fill:none;stroke:var(--wall2);stroke-width:7}
.clock .tick{stroke:var(--ink);stroke-width:1.4;stroke-linecap:round}
.clock .tick.big{stroke-width:3.4}
.clock .num{font-family:var(--f-ui);font-weight:800;font-size:19px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.clock .mlab{font-family:var(--f-ui);font-weight:700;font-size:9.5px;fill:var(--min-d);text-anchor:middle;dominant-baseline:central}
.clock .hh{stroke:var(--hour);stroke-width:8;stroke-linecap:round}
.clock .mh{stroke:var(--min);stroke-width:5;stroke-linecap:round}
.clock .pin{fill:var(--ink)}
.clock.live .hh,.clock.live .mh{transition:none}
.clock .grab{fill:transparent}
.clock.drag-h .hh{stroke-width:11}.clock.drag-m .mh{stroke-width:8}

.phrase{font-family:var(--f-read);font-weight:700;font-size:30px;line-height:1.9;margin:8px 0 2px;text-wrap:balance}
.digital{display:inline-block;font-family:var(--f-ui);font-weight:800;font-size:30px;letter-spacing:2px;background:var(--ink);color:#9BF0C6;border-radius:14px;padding:2px 18px;font-variant-numeric:tabular-nums;direction:ltr}
.legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-weight:700;font-size:15px;margin-top:6px}
.legend i{display:inline-block;width:28px;height:7px;border-radius:9px;vertical-align:middle;margin-inline-end:6px}
.nudge{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.nudge button{min-height:50px;font-size:16px;padding:6px 8px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:8px 16px;border-radius:999px;background:var(--paper);font-weight:800;font-size:16px;box-shadow:0 4px 0 var(--line)}
.tab.on{background:var(--ink);color:#fff;box-shadow:0 4px 0 #0E1C28}
.tip{background:var(--hl);border-radius:18px;padding:10px 14px;line-height:1.9;text-align:right;margin-bottom:12px}
.tip b{color:var(--hour-d)}.tip em{font-style:normal;color:var(--min-d);font-weight:800}

/* home */
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--paper);border-radius:28px;padding:14px 18px;box-shadow:0 6px 0 var(--line);margin-bottom:20px}
.hero .txt{flex:1;min-width:190px}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:32px;margin:0;line-height:1.35}
.hero p{margin:4px 0 0;color:var(--muted)}
.lvls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.lvl{display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:14px;text-align:right;position:relative}
.lvl .ttl{font-family:var(--f-display);font-size:23px;line-height:1.3}
.lvl .ex{font-family:var(--f-read);font-weight:700;font-size:16px;opacity:.95}
.lvl .st{position:absolute;top:12px;left:14px;font-size:17px;letter-spacing:2px}
.lvl svg{width:84px;height:84px;align-self:flex-start;margin-bottom:4px}
.learn-wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px}
.learn-wide svg{width:70px;height:70px;margin:0}
.panel{background:var(--paper);border-radius:22px;padding:14px 18px;box-shadow:0 5px 0 var(--line);margin-top:20px}
.panel h3{margin:0 0 6px;font-size:19px}
.panel ul{margin:0;padding-inline-start:20px;line-height:1.9;max-width:65ch}
.seg{display:inline-flex;background:var(--wall);border-radius:999px;padding:3px;gap:3px}
.seg button{padding:5px 14px;border-radius:999px;font-weight:800;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}

/* quiz */
.prog{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-weight:800;color:var(--muted)}
.bar{flex:1;height:12px;background:var(--paper);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--hour),var(--min));border-radius:999px;transition:width .5s}
.q{font-family:var(--f-read);font-weight:700;font-size:24px;line-height:1.9;margin:0 0 10px;text-wrap:balance}
.q.story{font-weight:500;font-size:23px}
.opts{display:grid;gap:12px;margin-top:12px}
.opt{background:var(--paper);color:var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--line);padding:6px 14px;font-family:var(--f-read);font-weight:700;font-size:22px;line-height:1.9;border:3px solid var(--wall2)}
.opt:active{transform:translateY(3px)}
.opt.ok{border-color:var(--leaf);background:#E2F5EC}
.opt.no{border-color:var(--bad);background:#FCE6E3;animation:shake .4s}
.opts.clocks{grid-template-columns:repeat(3,minmax(0,1fr))}
.opts.clocks .opt{padding:8px 4px}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.fb{min-height:34px;font-family:var(--f-display);font-size:23px;margin-top:10px;line-height:1.5}
.fb.good{color:var(--leaf)}.fb.bad{color:var(--bad);font-family:var(--f-ui);font-weight:800;font-size:17px}
.result{padding:10px 0}.result .big{font-size:74px;line-height:1.2}
.result h3{font-family:var(--f-display);font-weight:400;font-size:32px;margin:6px 0}
#toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;font-weight:800;opacity:0;pointer-events:none;transition:.3s;z-index:80;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.conf{position:fixed;top:-20px;width:12px;height:16px;border-radius:3px;z-index:90;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (max-width:560px){.lvls{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.lvl .ttl{font-size:20px}.lvl svg{width:64px;height:64px}.phrase{font-size:25px}.q{font-size:21px}.opt{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <header class="top">
    <button class="iconbtn" id="back" aria-label="الرئيسية" hidden>➜</button>
    <div class="brand" id="brand"><span class="h">ساعتي</span> <span class="m">الذكية</span></div>
    <div class="stars"><b>★</b><span id="starN">٠</span></div>
  </header>
  <main id="view"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
/* ================= TIME LANGUAGE ================= */
const HOURS=[null,'الْوَاحِدَةُ','الثَّانِيَةُ','الثَّالِثَةُ','الرَّابِعَةُ','الْخَامِسَةُ','السَّادِسَةُ','السَّابِعَةُ','الثَّامِنَةُ','التَّاسِعَةُ','الْعَاشِرَةُ','الْحَادِيَةَ عَشْرَةَ','الثَّانِيَةَ عَشْرَةَ'];
const MIN={5:'وَخَمْسُ دَقَائِقَ',10:'وَعَشْرُ دَقَائِقَ',15:'وَالرُّبْعُ',20:'وَالثُّلُثُ',25:'وَالنِّصْفُ إِلَّا خَمْسَ دَقَائِقَ',30:'وَالنِّصْفُ',35:'وَالنِّصْفُ وَخَمْسُ دَقَائِقَ',40:'إِلَّا ثُلُثًا',45:'إِلَّا رُبْعًا',50:'إِلَّا عَشْرَ دَقَائِقَ',55:'إِلَّا خَمْسَ دَقَائِقَ'};
const nextH=h=>h%12+1, prevH=h=>(h+10)%12+1;
function phrase(h,m){
  if(m===0)return `السَّاعَةُ ${HOURS[h]} تَمَامًا`;
  return `السَّاعَةُ ${HOURS[m<=35?h:nextH(h)]} ${MIN[m]}`;
}
const LEVELS=[
 {n:1,ttl:'الساعات الكاملة',mins:[0],ex:[3,0],dur:[60,120,180],
  tip:'عندما يشير <em>العقرب الطويل</em> إلى ١٢، ننظر إلى <b>العقرب القصير</b> ونقرأ الرقم الذي يشير إليه، ثم نقول: <b>تمامًا</b>.'},
 {n:2,ttl:'النصف',mins:[0,30],ex:[3,30],dur:[60,120,30],
  tip:'عندما يشير <em>العقرب الطويل</em> إلى ٦، تكون نصف ساعة قد مرّت، فنقول: <b>والنصف</b>. لاحظي أن <b>القصير</b> يكون في المنتصف بين رقمين، ونقرأ الرقم الذي تجاوزه.'},
 {n:3,ttl:'الربع',mins:[0,15,30,45],ex:[3,45],dur:[15,30,60,90],
  tip:'<em>الطويل</em> عند ٣ يعني <b>والربع</b>. وعند ٩ يعني <b>إلا ربعًا</b>. مع «إلا» نقول <b>الساعة التالية</b>: إذا كان القصير بعد ٣ وقبل ٤ نقول: الرابعة إلا ربعًا.'},
 {n:4,ttl:'كل خمس دقائق',mins:[0,5,10,15,20,25,30,35,40,45,50,55],ex:[3,20],dur:[10,20,30,60,90],
  tip:'كل رقم يمرّ عليه <em>الطويل</em> يساوي <b>٥ دقائق</b>. عند ٢ = وعشر دقائق، عند ٤ = <b>والثلث</b>، عند ٨ = <b>إلا ثلثًا</b>، عند ١٠ = إلا عشر دقائق. ومن ٨ فما بعد نقول الساعة التالية مع «إلا».'}
];
const DUR={10:'عَشْرَ دَقَائِقَ',15:'رُبْعَ سَاعَةٍ',20:'عِشْرِينَ دَقِيقَةً',30:'نِصْفَ سَاعَةٍ',60:'سَاعَةً وَاحِدَةً',90:'سَاعَةً وَنِصْفًا',120:'سَاعَتَيْنِ',180:'ثَلَاثَ سَاعَاتٍ'};
const STORY=[
 d=>`بَدَأَتْ مَرْيَمُ اللَّعِبَ فِي هَذَا الْوَقْتِ، وَلَعِبَتْ ${d}. مَتَى انْتَهَتْ مِنَ اللَّعِبِ؟`,
 d=>`وَضَعَتْ مَامَا الْكَعْكَةَ فِي الْفُرْنِ فِي هَذَا الْوَقْتِ، وَتَحْتَاجُ الْكَعْكَةُ ${d} لِتَنْضَجَ. مَتَى تَنْضَجُ؟`,
 d=>`نَامَتْ هِنْدٌ فِي هَذَا الْوَقْتِ، وَنَامَتْ ${d}. مَتَى اسْتَيْقَظَتْ؟`,
 d=>`بَدَأَ يُوسُفُ يُذَاكِرُ دُرُوسَهُ فِي هَذَا الْوَقْتِ، وَذَاكَرَ ${d}. مَتَى انْتَهَى؟`,
 d=>`رَكِبَتْ سَلْمَى الْقِطَارَ فِي هَذَا الْوَقْتِ، وَكَانَتِ الرِّحْلَةُ ${d}. مَتَى وَصَلَتْ؟`
];
const PRAISE=['أحسنتِ!','رائعة!','ممتاز!','برافو عليكِ!','شاطرة!'];

/* ================= STATE ================= */
const KEY='sa3ati-v1';
const DEF={stars:0,best:{},digits:'ar',stats:{read:[0,0],find:[0,0],set:[0,0],digital:[0,0],story:[0,0]}};
let S;try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY))||{});}catch(e){S=Object.assign({},DEF);}
S.stats=Object.assign({},DEF.stats,S.stats||{});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const $=s=>document.querySelector(s);const view=$('#view');
const ar=n=>Number(n).toLocaleString('ar-EG');
const dg=n=>S.digits==='ar'?ar(n):String(n);
const pad=n=>n<10?'0'+n:''+n;
const digital=(h,m)=>S.digits==='ar'?`${ar(h)}:${pad(m).split('').map(ar).join('')}`:`${h}:${pad(m)}`;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const strip=s=>s.replace(/[ً-ْ]/g,'');

/* ================= SOUND ================= */
let voice=null;const hasTTS='speechSynthesis' in window&&window.speechSynthesis;
function pickVoice(){if(!hasTTS)return;const vs=speechSynthesis.getVoices();voice=vs.find(v=>/^ar[-_]EG/i.test(v.lang))||vs.find(v=>/^ar/i.test(v.lang))||null;}
if(hasTTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(t){if(!hasTTS)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[.؟?،]/g,' '));u.lang=voice?voice.lang:'ar-SA';if(voice)u.voice=voice;u.rate=.8;speechSynthesis.speak(u);}catch(e){}}
function hush(){if(hasTTS)try{speechSynthesis.cancel();}catch(e){}}
let actx;function tone(f,d,w,type){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type=type||'triangle';o.frequency.value=f;const t=actx.currentTime+(w||0);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.05);}catch(e){}}
const sOk=()=>{tone(660,.16);tone(990,.25,.12);},sNo=()=>tone(220,.22,0,'square'),sTick=()=>tone(1400,.03,0,'square');

/* ================= UI ================= */
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2400);}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const cs=['var(--hour)','var(--min)','var(--sun)','var(--leaf)'];for(let i=0;i<36;i++){const c=document.createElement('i');c.className='conf';c.style.left=Math.random()*100+'vw';c.style.background=cs[i%4];c.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3000);}}
function addStars(n){S.stars+=n;save();$('#starN').textContent=ar(S.stars);const e=$('.stars');e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump');}
function header(back){const b=$('#back');b.hidden=!back;b.onclick=()=>go(back);$('#starN').textContent=ar(S.stars);}

/* ================= CLOCK ================= */
function clockSVG(h,m,o={}){
  const ticks=[];for(let i=0;i<60;i++){const a=i*6*Math.PI/180,big=i%5===0,r1=big?84:88;ticks.push(`<line class="tick ${big?'big':''}" x1="${100+r1*Math.sin(a)}" y1="${100-r1*Math.cos(a)}" x2="${100+93*Math.sin(a)}" y2="${100-93*Math.cos(a)}"/>`);}
  const nums=[];for(let i=1;i<=12;i++){const a=i*30*Math.PI/180;nums.push(`<text class="num" x="${100+70*Math.sin(a)}" y="${100-70*Math.cos(a)}">${dg(i)}</text>`);}
  const mlab=o.minutes?Array.from({length:12},(_,i)=>{const a=i*30*Math.PI/180;return `<text class="mlab" x="${100+107*Math.sin(a)}" y="${100-107*Math.cos(a)}">${dg(i*5)}</text>`;}).join(''):'';
  const vb=o.minutes?'-14 -14 228 228':'0 0 200 200';
  return `<svg class="clock ${o.live?'live':''}" ${o.id?`id="${o.id}"`:''} viewBox="${vb}" width="${o.size||260}" height="${o.size||260}" role="img" aria-label="${strip(phrase(h,m))}">
    <circle class="face" cx="100" cy="100" r="96"/><circle class="rim" cx="100" cy="100" r="99.5"/>${ticks.join('')}${nums.join('')}${mlab}
    <line class="hh" x1="100" y1="100" x2="100" y2="52"/><line class="mh" x1="100" y1="100" x2="100" y2="22"/>
    <circle class="pin" cx="100" cy="100" r="6"/></svg>`;
}
function setHands(svg,h,m){
  const ha=((h%12)+m/60)*30,ma=m*6;
  svg.querySelector('.hh').setAttribute('transform',`rotate(${ha} 100 100)`);
  svg.querySelector('.mh').setAttribute('transform',`rotate(${ma} 100 100)`);
  svg.setAttribute('aria-label',strip(phrase(h,m)));
}
function staticClock(h,m,o){const d=document.createElement('div');d.innerHTML=clockSVG(h,m,o);const s=d.firstElementChild;setHands(s,h,m);return s.outerHTML;}
/* Drag either hand. Far from centre = minute hand (snaps to 5 min, carries the hour); near = hour hand. */
function makeInteractive(svg,state,onChange){
  let mode=null;
  const angle=e=>{const r=svg.getBoundingClientRect();const x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2);let a=Math.atan2(x,-y)*180/Math.PI;if(a<0)a+=360;return {a,d:Math.hypot(x,y)/(r.width/2)};};
  svg.addEventListener('pointerdown',e=>{const {a,d}=angle(e);
    const ha=((state.h%12)+state.m/60)*30,ma=state.m*6;const diff=(x,y)=>Math.min(Math.abs(x-y),360-Math.abs(x-y));
    mode=(d<0.45&&diff(a,ha)<50)?'h':(diff(a,ma)<diff(a,ha)||d>0.6?'m':'h');
    svg.classList.add('drag-'+mode);svg.setPointerCapture(e.pointerId);move(e);e.preventDefault();});
  const move=e=>{if(!mode)return;const {a}=angle(e);
    if(mode==='m'){let m=Math.round(a/30)*5%60;if(m!==state.m){if(state.m>=45&&m<=15)state.h=nextH(state.h);else if(state.m<=15&&m>=45)state.h=prevH(state.h);state.m=m;sTick();onChange();}}
    else{let h=Math.round((a-state.m/2)/30);h=((h%12)+12)%12||12;if(h!==state.h){state.h=h;sTick();onChange();}}};
  svg.addEventListener('pointermove',move);
  const up=()=>{if(mode)svg.classList.remove('drag-'+mode);mode=null;};
  svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
}
function nudges(state,onChange,allowed){
  const step=allowed&&allowed.length>1?Math.min(...allowed.slice(1)):5;
  const w=document.createElement('div');w.className='nudge';
  const unit=step<=10?'دقائق':'دقيقة';
  w.innerHTML=`<button class="block btn c-hour" data-a="h+">+ ساعة</button><button class="block btn c-hour" data-a="h-">− ساعة</button>
   <button class="block btn c-min" data-a="m+">+ ${ar(step)} ${unit}</button><button class="block btn c-min" data-a="m-">− ${ar(step)} ${unit}</button>`;
  w.querySelectorAll('button').forEach(b=>b.onclick=()=>{const a=b.dataset.a;
    if(a==='h+')state.h=nextH(state.h);else if(a==='h-')state.h=prevH(state.h);
    else{let m=state.m+(a==='m+'?step:-step);if(m>=60){m-=60;state.h=nextH(state.h);}if(m<0){m+=60;state.h=prevH(state.h);}state.m=m;}
    sTick();onChange();});
  return w;
}

/* ================= SCREENS ================= */
const screens={};
function go(n,a){hush();view.scrollTop=0;screens[n](a);}

screens.home=function(){
  header(null);
  const now=new Date();
  view.innerHTML=`
  <section class="hero">${staticClock(now.getHours()%12||12,Math.floor(now.getMinutes()/5)*5,{size:96})}
    <div class="txt"><h1>كم الساعة الآن؟</h1><p>تقريبًا: ${phrase(now.getHours()%12||12,Math.floor(now.getMinutes()/5)*5).replace(' تَمَامًا','')}</p></div></section>
  <div class="lvls">
    <button class="block lvl learn-wide c-sun" id="learn">${staticClock(10,10,{size:70})}<span><span class="ttl" style="display:block">تعلّمي الساعة</span><span class="note" style="color:inherit">حرّكي العقارب بإصبعكِ واسمعي اسم الوقت</span></span></button>
    ${LEVELS.map((L,i)=>{const b=S.best[L.n];const st=b==null?'':(b>=7?'★★★':b>=5?'★★☆':'★☆☆');
      return `<button class="block lvl ${['c-hour','c-min','c-leaf','c-hour'][i]}" data-l="${L.n}"><span class="st">${st}</span>${staticClock(L.ex[0],L.ex[1],{size:84})}
      <span class="ttl">${ar(L.n)}. ${L.ttl}</span><span class="ex">${phrase(L.ex[0],L.ex[1])}</span></button>`;}).join('')}
  </div>
  <div class="panel"><h3>للأهل</h3>
    <ul>
      <li>ابدآ بـ«تعلّمي الساعة» في المستوى نفسه، ثم أسئلة المستوى. انتقلا للمستوى التالي بعد ٣ نجوم.</li>
      <li>العقرب القصير <b style="color:var(--hour-d)">وردي</b> والطويل <b style="color:var(--min-d)">أزرق</b> في كل مكان، ليسهل التمييز بينهما.</li>
      <li>أكثر خطأ شائع: مع «إلا» نقرأ الساعة <b>التالية</b>. الأسئلة تتعمّد هذا الخطأ في الاختيارات.</li>
      <li>اسألاها خلال اليوم: «كم الساعة الآن؟» عند ساعة الحائط في البيت.</li>
    </ul>
    <div class="row" style="margin-top:10px"><span class="note" style="font-weight:700">أرقام الساعة:</span><div class="seg" id="dg"><button data-v="ar" class="${S.digits==='ar'?'on':''}">١٢٣</button><button data-v="en" class="${S.digits==='en'?'on':''}">123</button></div></div>
    <p class="note">الإجابات الصحيحة من أول مرة: ${Object.entries({read:'قراءة الساعة',find:'اختيار الساعة',set:'ضبط العقارب',digital:'الساعة الرقمية',story:'المسائل'}).map(([k,t])=>`${t} ${S.stats[k][1]?ar(Math.round(S.stats[k][0]/S.stats[k][1]*100))+'٪':'—'}`).join(' · ')}</p>
  </div>`;
  $('#learn').onclick=()=>go('learn',1);
  view.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>go('quiz',+b.dataset.l));
  view.querySelectorAll('#dg button').forEach(b=>b.onclick=()=>{S.digits=b.dataset.v;save();go('home');});
};

screens.learn=function(lv){
  header('home');
  const L=LEVELS[lv-1];const state={h:L.ex[0],m:L.ex[1]};
  view.innerHTML=`<div class="tabs">${LEVELS.map(x=>`<button class="tab ${x.n===lv?'on':''}" data-l="${x.n}">${ar(x.n)}. ${x.ttl}</button>`).join('')}</div>
   <div class="tip">${L.tip}</div>
   <div class="card">${clockSVG(state.h,state.m,{id:'lc',minutes:lv>=3,live:true,size:300})}
     <div class="legend"><span><i style="background:var(--hour)"></i>القصير: الساعات</span><span><i style="background:var(--min)"></i>الطويل: الدقائق</span></div>
     <div class="phrase" id="ph"></div><div class="row center"><span class="digital" id="dgt"></span><button class="iconbtn" id="say" aria-label="اسمعي">🔊</button></div>
     <div id="nd"></div>
     <div class="row center" style="margin-top:14px"><button class="block btn c-sun" id="ex">مثال آخر</button><button class="block btn c-leaf" id="toQ">إلى الأسئلة</button></div>
   </div><p class="note" style="text-align:center">اسحبي العقرب الطويل حول الساعة، وراقبي كيف يتحرك القصير معه ببطء.</p>`;
  const svg=$('#lc');
  const upd=()=>{if(!L.mins.includes(state.m)&&lv<4){/* keep exploring freely; phrase still valid for 5-min steps */}setHands(svg,state.h,state.m);$('#ph').textContent=phrase(state.h,state.m);$('#dgt').textContent=digital(state.h,state.m);};
  upd();makeInteractive(svg,state,upd);$('#nd').appendChild(nudges(state,upd,L.mins));
  $('#say').onclick=()=>speak(phrase(state.h,state.m));
  $('#ex').onclick=()=>{state.h=1+Math.floor(Math.random()*12);state.m=rnd(L.mins);upd();speak(phrase(state.h,state.m));};
  $('#toQ').onclick=()=>go('quiz',lv);
  view.querySelectorAll('.tab').forEach(b=>b.onclick=()=>go('learn',+b.dataset.l));
};

/* distractors: neighbouring hour (the classic «إلا» mistake), swapped hands, other minutes */
function distract(h,m,L,n){
  const c=[[prevH(h),m],[nextH(h),m],[(m/5)||12,(h%12)*5],[h,(m+30)%60],[h,(60-m)%60],[h,rnd(L.mins)],[1+Math.floor(Math.random()*12),rnd(L.mins)]];
  const out=[],seen=new Set([phrase(h,m)]);
  for(const [a,b] of shuffle(c.slice(0,3)).concat(shuffle(c.slice(3)))){if(!L.mins.includes(b))continue;const p=phrase(a,b);if(seen.has(p))continue;seen.add(p);out.push([a,b]);if(out.length===n)break;}
  while(out.length<n){const a=1+Math.floor(Math.random()*12),b=rnd(L.mins),p=phrase(a,b);if(!seen.has(p)){seen.add(p);out.push([a,b]);}}
  return out;
}
screens.quiz=function(lv){
  header('home');
  const L=LEVELS[lv-1];
  const types=['read','find','set','read','story','find','set',lv>=2?'digital':'read'];
  const qs=shuffle(types).map(t=>({t,h:1+Math.floor(Math.random()*12),m:rnd(L.mins)}));
  let qi=0,score=0;
  const finish=()=>{
    S.best[lv]=Math.max(S.best[lv]||0,score);save();if(score>=7)confetti();
    view.innerHTML=`<div class="card result"><div class="big">${score>=7?'🏆':score>=5?'⏰':'💪'}</div><h3>${score>=7?'ممتاز! أنتِ تعرفين الساعة':score>=5?'أحسنتِ! قريبة جدًا':'تدريب جميل! جرّبي «تعلّمي الساعة» ثم أعيدي'}</h3>
      <p class="sub" style="font-size:21px">${ar(score)} من ${ar(qs.length)} صحيحة من أول مرة</p>
      <div class="row center"><button class="block btn c-ghost" id="lrn">تعلّمي الساعة</button><button class="block btn c-leaf" id="ag">أسئلة جديدة</button>${score>=7&&lv<4?'<button class="block btn c-min" id="nx">المستوى التالي</button>':''}</div></div>`;
    $('#ag').onclick=()=>go('quiz',lv);$('#lrn').onclick=()=>go('learn',lv);const nx=$('#nx');if(nx)nx.onclick=()=>go('quiz',lv+1);
  };
  const render=()=>{
    if(qi>=qs.length)return finish();
    let q=qs[qi],first=true,locked=false;
    const P=phrase(q.h,q.m);
    const head=`<div class="prog"><span>${ar(L.n)}. ${L.ttl} · ${ar(qi+1)}/${ar(qs.length)}</span><div class="bar"><i style="width:${qi/qs.length*100}%"></i></div></div>`;
    const right=()=>{locked=true;sOk();if(first){score++;addStars(1);}S.stats[q.t][1]++;if(first)S.stats[q.t][0]++;save();const fb=$('#fb');fb.className='fb good';fb.textContent=rnd(PRAISE);speak(phraseFor());setTimeout(()=>{qi++;render();},1700);};
    const phraseFor=()=>q.t==='story'?phrase(q.eh,q.em):P;
    const wrong=(msg)=>{first=false;sNo();const fb=$('#fb');fb.className='fb bad';fb.textContent=msg||'حاولي مرة أخرى';};
    const hintFor=(a,b)=>{const end=q.t==='story'?[q.eh,q.em]:[q.h,q.m];
      if(b===end[1]&&(a===nextH(end[0])||a===prevH(end[0])))return end[1]>=40?'انتبهي: مع «إلا» نقول الساعة التالية. انظري أين العقرب القصير.':'الدقائق صحيحة، لكن الساعة لا. انظري إلى العقرب القصير.';
      if(a===end[0])return 'الساعة صحيحة، لكن الدقائق لا. انظري إلى العقرب الطويل.';
      return 'ليست هذه. ابدئي بالعقرب القصير، ثم الطويل.';};
    if(q.t==='read'||q.t==='digital'){
      const opts=shuffle([[q.h,q.m],...distract(q.h,q.m,L,2)]);
      view.innerHTML=head+`<div class="card"><p class="q">${q.t==='read'?'كم الساعة؟':'هذه ساعة رقمية. كيف نقرؤها؟'}</p>
        ${q.t==='read'?staticClock(q.h,q.m,{size:240}):`<div style="margin:16px 0"><span class="digital" style="font-size:52px">${digital(q.h,q.m)}</span></div>`}
        <div class="opts">${opts.map(([a,b])=>`<button class="opt" data-a="${a}" data-b="${b}">${phrase(a,b)}</button>`).join('')}</div><div class="fb" id="fb"></div></div>`;
    }else if(q.t==='find'){
      const opts=shuffle([[q.h,q.m],...distract(q.h,q.m,L,2)]);
      view.innerHTML=head+`<div class="card"><p class="q">أين ${P}؟</p><div class="row center"><button class="iconbtn" id="say" aria-label="اسمعي">🔊</button></div>
        <div class="opts clocks">${opts.map(([a,b])=>`<button class="opt" data-a="${a}" data-b="${b}">${staticClock(a,b,{size:110})}</button>`).join('')}</div><div class="fb" id="fb"></div></div>`;
      $('#say').onclick=()=>speak(P);
    }else if(q.t==='story'){
      const d=rnd(L.dur);const tot=q.m+d;q.em=tot%60;q.eh=q.h;for(let k=0;k<Math.floor(tot/60);k++)q.eh=nextH(q.eh);
      const wrongs=[];const seen=new Set([phrase(q.eh,q.em)]);
      const cand=shuffle([[q.h,q.m],...L.dur.filter(x=>x!==d).map(x=>{const t=q.m+x;let hh=q.h;for(let k=0;k<Math.floor(t/60);k++)hh=nextH(hh);return [hh,t%60];}),[prevH(q.eh),q.em],[nextH(q.eh),q.em]]);
      for(const c of cand){const p=phrase(c[0],c[1]);if(!seen.has(p)&&L.mins.includes(c[1])){seen.add(p);wrongs.push(c);}if(wrongs.length===2)break;}
      const opts=shuffle([[q.eh,q.em],...wrongs]);
      const txt=rnd(STORY)(DUR[d]);
      view.innerHTML=head+`<div class="card"><p class="q story">${txt}</p><div class="row center"><button class="iconbtn" id="say" aria-label="اسمعي">🔊</button></div>${staticClock(q.h,q.m,{size:190})}
        <p class="note" style="margin:4px 0 0">الوقت في البداية</p>
        <div class="opts">${opts.map(([a,b])=>`<button class="opt" data-a="${a}" data-b="${b}">${phrase(a,b)}</button>`).join('')}</div><div class="fb" id="fb"></div></div>`;
      $('#say').onclick=()=>speak(txt);
    }else{ /* set */
      const st={h:12,m:0};if(q.h===12&&q.m===0)q.h=nextH(q.h);
      view.innerHTML=head+`<div class="card"><p class="q">اضبطي الساعة على:<br>${P}</p><div class="row center"><button class="iconbtn" id="say" aria-label="اسمعي">🔊</button></div>
        ${clockSVG(12,0,{id:'sc',live:true,size:270,minutes:lv>=3})}<div class="row center"><span class="digital" id="dgt" style="font-size:24px"></span></div>
        <div id="nd"></div><div class="row center" style="margin-top:14px"><button class="block btn c-leaf" id="chk">تحقّقي ✓</button><button class="block btn c-ghost" id="show" hidden>أريني</button></div><div class="fb" id="fb"></div></div>`;
      const svg=$('#sc');const upd=()=>{setHands(svg,st.h,st.m);$('#dgt').textContent=digital(st.h,st.m);};upd();
      makeInteractive(svg,st,upd);$('#nd').appendChild(nudges(st,upd,L.mins));
      $('#say').onclick=()=>speak(P);let tries=0;
      $('#chk').onclick=()=>{if(locked)return;if(st.h===q.h&&st.m===q.m)return right();tries++;
        wrong(st.m!==q.m&&st.h!==q.h?'العقربان ليسا في مكانهما. ابدئي بالطويل.':st.m!==q.m?'العقرب الطويل (الأزرق) ليس في مكانه.':(q.m>=40?'العقرب القصير ليس في مكانه. تذكّري: مع «إلا» يكون القصير قبل الساعة التالية بقليل.':'العقرب القصير (الوردي) ليس في مكانه.'));
        if(tries>=2)$('#show').hidden=false;};
      $('#show').onclick=()=>{st.h=q.h;st.m=q.m;upd();speak(P);};
      return;
    }
    view.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(locked)return;const a=+b.dataset.a,c=+b.dataset.b;const end=q.t==='story'?[q.eh,q.em]:[q.h,q.m];
      if(a===end[0]&&c===end[1]){b.classList.add('ok');right();}else{b.classList.remove('no');void b.offsetWidth;b.classList.add('no');wrong(hintFor(a,c));}});
  };
  render();
};

go('home');
})();
