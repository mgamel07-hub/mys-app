<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141E36">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<title>حفظ عمّ وتبارك</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Baloo+Bhaijaan+2:wght@500;700;800&family=Lalezar&display=swap">
<style>
/* Layout: the surah is about the night prayer, so the app is a night sky with a lamp-gold accent; the Quran text always sits on a calm ivory "mushaf page". A five-stop journey map leads through the portions. Deliberately a single dark look. */
:root{
  color-scheme: dark;
  --night:#141E36; --night2:#1D2A4A; --night3:#28385F; --star:#C9D3EE; --dim:#8C9AC0;
  --page:#F7F3E8; --page-ink:#1E2433; --page-line:#E4DCC6;
  --lamp:#F2B84B; --lamp-d:#B98319; --mint:#3FB58A; --mint-d:#2A8A66; --rose:#E06A7A; --rose-d:#B24758;
  --sea:#5B8DEF; --sea-d:#3D69C4; --hl:#FCE7A6;
  --f-q:'Amiri Quran','Amiri','Traditional Arabic',serif;
  --f-display:'Lalezar','Baloo Bhaijaan 2',Tahoma,sans-serif;
  --f-ui:'Baloo Bhaijaan 2','Segoe UI',Tahoma,Arial,sans-serif;
  --qs:1;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--star);font-family:var(--f-ui);font-size:17px;direction:rtl;overflow:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff8 50%,transparent),radial-gradient(1px 1px at 78% 9%,#fff9 50%,transparent),radial-gradient(1.5px 1.5px at 55% 32%,#fff6 50%,transparent),radial-gradient(1px 1px at 30% 70%,#fff7 50%,transparent),radial-gradient(1.5px 1.5px at 88% 60%,#fff6 50%,transparent),radial-gradient(1px 1px at 8% 88%,#fff8 50%,transparent)}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,select:focus-visible{outline:3px solid var(--lamp);outline-offset:3px}
#app{position:relative;z-index:1;height:100%;max-width:860px;margin:0 auto;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-display);font-size:25px;color:var(--lamp);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.iconbtn{width:48px;height:48px;border-radius:16px;background:var(--night2);box-shadow:0 4px 0 #0B1222;display:grid;place-items:center;font-size:21px;flex:none}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #0B1222}
.stars{display:flex;align-items:center;gap:6px;background:var(--night2);border-radius:999px;padding:6px 14px 6px 10px;font-weight:800;font-size:19px;box-shadow:0 4px 0 #0B1222}
.stars b{color:var(--lamp);font-size:21px}
.stars.bump{animation:bump .5s}@keyframes bump{40%{transform:scale(1.25)}}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:4px 30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h2.h{font-family:var(--f-display);font-weight:400;font-size:28px;margin:4px 0;color:#fff;text-wrap:balance}
.sub{color:var(--dim);margin:0 0 14px;line-height:1.7}

.block{--c:var(--lamp);--d:var(--lamp-d);background:var(--c);color:#1B1A14;border-radius:20px;box-shadow:0 6px 0 var(--d);transition:transform .08s,box-shadow .08s}
.block:active{transform:translateY(4px);box-shadow:0 2px 0 var(--d)}
.c-mint{--c:var(--mint);--d:var(--mint-d);color:#fff}.c-sea{--c:var(--sea);--d:var(--sea-d);color:#fff}.c-rose{--c:var(--rose);--d:var(--rose-d);color:#fff}
.c-ghost{--c:var(--night2);--d:#0B1222;color:var(--star)}
.btn{padding:10px 20px;font-size:19px;font-weight:800;min-height:54px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row.center{justify-content:center}

/* hero */
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,var(--night2),var(--night3));border-radius:26px;padding:18px 20px;margin-bottom:20px}
.moon{width:74px;height:74px;border-radius:50%;flex:none;box-shadow:inset -16px -6px 0 0 var(--lamp);transform:rotate(-20deg)}
.hero h1{font-family:var(--f-q);font-weight:400;font-size:36px;margin:0;color:#fff;line-height:1.6}
.hero p{margin:0;color:var(--dim);font-size:15px}
.hero .bar{margin-top:8px}
.bar{height:12px;background:#0B1222;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lamp),var(--mint));border-radius:999px;transition:width .6s}

/* journey */
.path{position:relative;display:grid;gap:16px;padding-inline-start:34px}
.path::before{content:"";position:absolute;top:30px;bottom:30px;right:13px;border-right:4px dotted var(--night3)}
.stop{position:relative;display:flex;align-items:center;gap:14px;text-align:right;padding:14px 16px;background:var(--night2);border-radius:22px;box-shadow:0 6px 0 #0B1222;width:100%}
.stop:active{transform:translateY(4px);box-shadow:0 2px 0 #0B1222}
.stop .dot{position:absolute;right:-34px;top:50%;margin-top:-15px;width:30px;height:30px;border-radius:50%;background:var(--night3);border:4px solid var(--night);display:grid;place-items:center;font-size:14px;font-weight:800;color:var(--star)}
.stop.done .dot{background:var(--mint);color:#fff}
.stop.cur .dot{background:var(--lamp);color:#1B1A14}
.stop .tx{flex:1;min-width:0}
.stop .t{font-family:var(--f-display);font-size:22px;color:#fff;line-height:1.4}
.stop .a{font-family:var(--f-q);font-size:19px;color:var(--star);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.9}
.stop .m{font-size:13px;color:var(--dim)}
.stop .st{font-size:18px;color:var(--lamp);letter-spacing:2px;flex:none}
.badge{display:inline-block;font-size:12px;font-weight:800;padding:1px 9px;border-radius:999px;background:var(--rose);color:#fff;margin-inline-start:6px;vertical-align:middle}
.final{margin-top:18px;width:100%;padding:16px;text-align:center}
.final .t{font-family:var(--f-display);font-size:22px}

/* mushaf page */
.mushaf{background:var(--page);color:var(--page-ink);border-radius:22px;padding:18px 18px 14px;box-shadow:0 8px 0 #0B1222;margin:12px 0 16px;border:3px double var(--page-line)}
.basmala{text-align:center;font-family:var(--f-q);font-size:calc(28px * var(--qs));line-height:2;margin-bottom:4px}
.line{font-family:var(--f-q);font-size:calc(30px * var(--qs));line-height:2.25;text-align:justify;padding:2px 8px;border-radius:12px;transition:background .2s}
.line.cur{background:var(--hl)}
.line.turn{background:#D8F1E5}
.qw{border-radius:8px;transition:color .2s,background .2s}
.qw.hid{color:transparent;background:var(--page-line);cursor:pointer;-webkit-user-select:none;user-select:none}
.qw.peek{color:var(--sea-d)}
.num{font-family:var(--f-q);color:var(--lamp-d);white-space:nowrap}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:6px}
.tab{padding:10px 4px;border-radius:16px;background:var(--night2);font-weight:800;font-size:16px;box-shadow:0 4px 0 #0B1222;line-height:1.3}
.tab.on{background:var(--lamp);color:#1B1A14;box-shadow:0 4px 0 var(--lamp-d)}
.panel{background:var(--night2);border-radius:20px;padding:14px 16px;margin-top:6px}
.panel label{font-weight:700;font-size:15px;color:var(--dim)}
.seg{display:inline-flex;background:#0B1222;border-radius:999px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{padding:6px 14px;border-radius:999px;font-weight:800;font-size:15px;color:var(--dim)}
.seg button.on{background:var(--star);color:var(--night)}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:6px 0}
.turnmsg{min-height:34px;text-align:center;font-family:var(--f-display);font-size:24px;color:var(--mint)}
.warn{background:#3A2E14;border:2px solid var(--lamp-d);color:#FBE7B5;border-radius:16px;padding:10px 14px;font-size:15px;line-height:1.8;margin:8px 0}
.warn a{color:var(--lamp)}

/* tests */
.opts{display:grid;gap:12px}
.opt{background:var(--page);color:var(--page-ink);border-radius:18px;box-shadow:0 5px 0 #0B1222;padding:6px 16px;font-family:var(--f-q);font-size:calc(26px * var(--qs));line-height:2;text-align:right;border:3px solid transparent}
.opt:active{transform:translateY(3px)}
.opt.ok{border-color:var(--mint);background:#E2F5EC}
.opt.no{border-color:var(--rose);background:#FBE5E8;animation:shake .4s}
.opt.used{opacity:.35;pointer-events:none}
.opts.words{grid-template-columns:repeat(3,minmax(0,1fr))}
.opts.words .opt{text-align:center;padding:6px 4px}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.blank{display:inline-block;min-width:3em;border-bottom:3px dashed var(--lamp-d);color:transparent}
.gtitle{font-family:var(--f-display);font-size:22px;color:#fff;margin:10px 0 2px}
.fb{min-height:34px;font-family:var(--f-display);font-size:24px;text-align:center;margin-top:10px}
.fb.good{color:var(--mint)}.fb.bad{color:var(--rose)}
.ordered{counter-reset:o}
.picked{background:var(--page);color:var(--page-ink);border-radius:14px;padding:2px 14px;font-family:var(--f-q);font-size:calc(22px * var(--qs));line-height:2;margin-bottom:6px;border-inline-start:6px solid var(--mint)}
.result{text-align:center;padding:14px 0}.result .big{font-size:70px;line-height:1.2}
.result h3{font-family:var(--f-display);font-weight:400;font-size:30px;margin:6px 0;color:#fff}
.rate{display:grid;gap:12px}
.mean{display:grid;gap:8px}
.mean div{background:var(--page);color:var(--page-ink);border-radius:14px;padding:6px 14px;line-height:1.9}
.mean b{font-family:var(--f-q);font-weight:400;font-size:22px;color:var(--sea-d)}
.sheet-back{position:fixed;inset:0;background:#050A16cc;display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--night2);width:100%;max-width:760px;max-height:90%;overflow-y:auto;border-radius:28px 28px 0 0;padding-block:16px calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
#toast{position:fixed;left:50%;top:calc(74px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);background:var(--lamp);color:#1B1A14;padding:10px 20px;border-radius:999px;font-weight:800;opacity:0;pointer-events:none;transition:.3s;z-index:80;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.conf{position:fixed;top:-20px;width:10px;height:14px;border-radius:3px;z-index:90;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.note{font-size:14px;color:var(--dim);line-height:1.8}
select{font:inherit;font-size:16px;padding:6px 10px;border-radius:12px;border:2px solid var(--night3);background:#0B1222;color:var(--star);max-width:100%}
@media (max-width:560px){.tab{font-size:14px}.hero h1{font-size:30px}.opts.words{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
.slist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.scard{display:flex;flex-direction:column;gap:4px;text-align:right;padding:14px 16px;background:var(--night2);border-radius:22px;box-shadow:0 6px 0 #0B1222;position:relative}
.scard:active{transform:translateY(4px);box-shadow:0 2px 0 #0B1222}
.scard .sn{font-family:var(--f-q);font-size:30px;color:#fff;line-height:1.7}
.scard .sm{font-size:13px;color:var(--dim)}
.scard .no{position:absolute;top:12px;left:14px;font-size:13px;font-weight:800;color:var(--dim)}
.scard.started{outline:2px solid var(--night3)}
.scard.full{outline:2px solid var(--mint)}
@media (max-width:560px){.slist{grid-template-columns:minmax(0,1fr)}}
</style>
<div id="app">
  <header class="top">
    <button class="iconbtn" id="backBtn" aria-label="رجوع" hidden>➜</button>
    <div class="brand" id="brand">حفظ عمّ وتبارك</div>
    <div class="stars"><b>★</b><span id="starN">٠</span></div>
  </header>
  <main id="view"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<audio id="player" preload="auto"></audio>

<script>
(function(){
"use strict";

/* Other surahs: stops of consecutive ayat, about 40 words and at most 7 ayat each. */
const STOP_WORDS=40,STOP_AYAT=7;
const stopCache={};
function stopsOf(n){
  if(n==73)return MUZZ;
  if(stopCache[n])return stopCache[n];
  const ay=QURAN[n],out=[];let from=1,words=0;
  ay.forEach((t,k)=>{const a=k+1;words+=t.split(' ').length;
    if(words>=STOP_WORDS||a-from+1>=STOP_AYAT||a===ay.length){out.push({from,to:a});from=a+1;words=0;}});
  const last=out[out.length-1];
  if(out.length>1&&last.to===last.from&&QURAN[n][last.from-1].split(' ').length<25){out.pop();out[out.length-1].to=last.to;}
  return stopCache[n]=out;
}
function linesOf(n,p){
  const out=[];
  for(let a=p.from;a<=p.to;a++){
    const t=QURAN[n][a-1],ws=t.split(' ');let parts;
    if(n==73&&a===20){let cur=[];parts=[];ws.forEach(w=>{cur.push(w);if(A20_SPLIT.includes(w)&&parts.length<A20_SPLIT.length){parts.push(cur.join(' '));cur=[];}});if(cur.length)parts.push(cur.join(' '));}
    else if(ws.length>20){const k=Math.ceil(ws.length/11),sz=Math.ceil(ws.length/k);parts=[];for(let i=0;i<ws.length;i+=sz)parts.push(ws.slice(i,i+sz).join(' '));}
    else parts=[t];
    parts.forEach((x,i)=>out.push({a,t:x,last:i===parts.length-1}));
  }
  return out;
}

  <div class="path">${st.map((p,i)=>{const s=S.p[n+':'+i]||{};const stars=(s.listen?1:0)+(s.test>=1?1:0)+(mastered(n,i)?1:0);
    return `<button class="stop ${mastered(n,i)?'done':i===cur?'cur':''}" data-i="${i}"><span class="dot">${mastered(n,i)?'✓':ar(i+1)}</span>
      <span class="tx"><span class="t" style="display:block">${stopName(n,i)}${needsReview(n,i)?'<span class="badge">راجعيها</span>':''}</span>
      <span class="a" style="display:block">${QURAN[n][p.from-1].split(' ').slice(0,4).join(' ')}…</span>
      <span class="m">${rangeTxt(p)}</span></span>
      <span class="st" aria-label="تقدم">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</span></button>`;}).join('')}</div>
  <button class="block final ${d===st.length?'c-mint':'c-ghost'}" id="whole"><span class="t">اختبار السورة كاملة</span><br><span class="note" style="color:inherit">${d===st.length?'جاهزة للتحدي الكبير!':'الأفضل بعد حفظ كل المحطات، ويمكنكِ تجربته الآن'}</span></button>`;
  view.querySelectorAll('.stop').forEach(b=>b.onclick=()=>go('portion',n,+b.dataset.i,'listen'));
  $('#whole').onclick=()=>go('whole',n);
};

/* ---------- portion ---------- */
const TABS=[['listen','استمعي'],['hide','احفظي'],['test','اختبري'],['recite','سمّعي']];
let opt={rep:3,gap:1,loop:false,hide:1};
screens.portion=function(n,i,tab){
  const p=stopsOf(n)[i];const lines=linesOf(n,p);
  header(`${INFO[n][0]} · ${stopName(n,i)}`,()=>go('surah',n));
  view.innerHTML=`<div class="tabs">${TABS.map(([k,t])=>`<button class="tab ${k===tab?'on':''}" data-t="${k}">${t}</button>`).join('')}</div>
   <div class="row" style="justify-content:space-between;margin:10px 0 0"><p class="sub" style="margin:0;flex:1;min-width:180px">${p.sum||rangeTxt(p)+' من سورة '+INFO[n][0]}</p>${p.m?'<button class="block btn c-ghost" id="mean" style="min-height:44px;font-size:16px">معاني الكلمات</button>':''}</div>
   <div id="pane"></div>`;
  view.querySelectorAll('.tab').forEach(b=>b.onclick=()=>go('portion',n,i,b.dataset.t));
  if(p.m)$('#mean').onclick=()=>sheet(`<h2 class="h">معاني الكلمات</h2><p class="sub">${p.sum}</p><div class="mean">${p.m.map(([w,m])=>`<div><b>${w}</b>: ${m}</div>`).join('')}</div><p class="note" style="margin-top:12px">المعاني مبسّطة للأطفال، اعتمادًا على التفسير الميسّر.</p>`);
  ({listen:listenPane,hide:hidePane,test:testPane,recite:recitePane})[tab]($('#pane'),n,i,p,lines);
};
function mushaf(lines,withBasmala){
  return `<div class="mushaf">${withBasmala?`<div class="basmala">${BASMALA}</div>`:''}${lines.map((l,k)=>`<div class="line" data-k="${k}" data-a="${l.a}">${
    l.t.split(' ').map((w,j)=>`<span class="qw" data-j="${j}">${w}</span>`).join(' ')}${l.last?' '+numMark(l.a):''}</div>`).join('')}</div>`;
}
function listenPane(pane,n,i,p,lines){
  pane.innerHTML=`${audioWarnHTML()}${mushaf(lines,p.from===1)}
   <div class="turnmsg" id="turn"></div>
   <div class="row center"><button class="block btn c-mint" id="play">▶ ابدئي</button><button class="block btn c-ghost" id="stop">إيقاف</button></div>
   <div class="panel" style="margin-top:16px">
    <div class="ctl"><label>كرّري كل آية</label><div class="seg" id="rep">${[1,3,5,7].map(v=>`<button data-v="${v}" class="${opt.rep===v?'on':''}">${ar(v)}</button>`).join('')}</div></div>
    <div class="ctl"><label>وقت للترديد بعد كل آية</label><div class="seg" id="gap">${[[0,'بدون'],[1,'نعم']].map(([v,t])=>`<button data-v="${v}" class="${opt.gap===v?'on':''}">${t}</button>`).join('')}</div></div>
    <div class="ctl"><label>إعادة المحطة كاملة</label><div class="seg" id="loop">${[[false,'مرة'],[true,'بلا توقف']].map(([v,t])=>`<button data-v="${v}" class="${opt.loop===v?'on':''}">${t}</button>`).join('')}</div></div>
    <p class="note">المسي أي آية لتسمعيها وحدها. مع «وقت للترديد» تتوقف التلاوة بعد كل آية لتعيديها بصوتكِ.</p></div>`;
  const seg=(id,key,conv)=>pane.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{opt[key]=conv(b.dataset.v);pane.querySelectorAll('#'+id+' button').forEach(x=>x.classList.toggle('on',x===b));});
  seg('rep','rep',Number);seg('gap','gap',Number);seg('loop','loop',v=>v==='true');
  const ayahEls=a=>[...pane.querySelectorAll(`.line[data-a="${a}"]`)];
  const clear=()=>pane.querySelectorAll('.line').forEach(l=>l.classList.remove('cur','turn'));
  const turn=$('#turn');let run=0;
  async function playOne(a,my){
    clear();ayahEls(a).forEach(e=>e.classList.add('cur'));ayahEls(a)[0].scrollIntoView({block:'nearest',behavior:'smooth'});
    const t0=Date.now();const good=await playAyah(n,a);
    if(my!==run||!good)return false;
    if(opt.gap){const dur=Math.min(30000,Math.max(2500,(Date.now()-t0)*1.1));clear();ayahEls(a).forEach(e=>e.classList.add('turn'));turn.textContent='دوركِ! ردّدي الآية';await wait(dur);turn.textContent='';if(my!==run)return false;}
    return true;
  }
  $('#play').onclick=async()=>{
    const my=++run;let first=true;
    do{
      if(p.from===1&&first){clear();turn.textContent='';const g=await playAyah(n,0);if(my!==run||!g)break;}
      first=false;
      for(let a=p.from;a<=p.to&&my===run;a++){for(let r=0;r<opt.rep&&my===run;r++){if(!await playOne(a,my)){run++;break;}}}
      if(my===run){const s=P(n,i);if(!s.listen){addStars(1);toast('نجمة الاستماع! ★');}s.listen++;save();}
    }while(opt.loop&&my===run);
    if(my===run){clear();turn.textContent='';}
  };
  $('#stop').onclick=()=>{run++;stopAudio();clear();turn.textContent='';};
  pane.querySelectorAll('.line').forEach(l=>l.onclick=async()=>{const my=++run;await playOne(+l.dataset.a,my);if(my===run)clear();turn.textContent='';});
}
function hidePane(pane,n,i,p,lines){
  const levels=['كاملة','أول كلمة','تلميح','مخفية'];
  pane.innerHTML=`<div class="panel" style="margin-top:10px"><div class="ctl"><label>الإخفاء</label><div class="seg" id="lv">${levels.map((l,k)=>`<button data-v="${k}" class="${opt.hide===k?'on':''}">${l}</button>`).join('')}</div></div>
   <p class="note">اقرئي من حفظكِ. المسي أي كلمة مخفية لتظهر لحظة. في «تلميح» تظهر أول كلمة من السطر عند اللمس. كلما تقدّمتِ، اختاري إخفاءً أكثر.</p></div>
   ${mushaf(lines,p.from===1)}
   <div class="row center"><button class="block btn c-sea" id="reveal">إظهار الكل لحظة</button></div>`;
  const apply=()=>pane.querySelectorAll('.line').forEach(l=>l.querySelectorAll('.qw').forEach((w,j)=>{const show=opt.hide===0||(opt.hide===1&&j===0);w.classList.toggle('hid',!show);w.classList.remove('peek');}));
  apply();
  pane.querySelectorAll('#lv button').forEach(b=>b.onclick=()=>{opt.hide=+b.dataset.v;pane.querySelectorAll('#lv button').forEach(x=>x.classList.toggle('on',x===b));apply();});
  const peek=w=>{w.classList.remove('hid');w.classList.add('peek');setTimeout(()=>{if(opt.hide!==0){w.classList.add('hid');w.classList.remove('peek');}},2000);};
  pane.addEventListener('click',e=>{const w=e.target.closest('.qw.hid');if(!w)return;
    if(opt.hide===2){const f=w.closest('.line').querySelector('.qw');if(f.classList.contains('hid')){peek(f);return;}}
    peek(w);});
  $('#reveal').onclick=()=>{pane.querySelectorAll('.qw.hid').forEach(w=>{w.classList.remove('hid');w.classList.add('peek');});setTimeout(apply,3000);};
}
function testPane(pane,n,i,p,lines){
  const games=[['order','رتّبي الآيات','الآيات مخلوطة، المسيها بالترتيب الصحيح'],['missing','الكلمة الناقصة','اختاري الكلمة المخفية في الآية'],['next','ما الآية التالية؟','اختاري الآية التي تأتي بعدها']];
  const menu=()=>{pane.innerHTML=`<div style="display:grid;gap:12px;margin-top:12px">${games.filter(g=>(g[0]!=='next'||lines.length>3)&&(g[0]!=='order'||lines.length>2)).map(g=>`<button class="block btn c-ghost" style="justify-content:flex-start;text-align:right;flex-direction:column;align-items:flex-start;padding:14px 18px" data-g="${g[0]}"><span class="gtitle" style="margin:0">${g[1]}</span><span class="note">${g[2]}</span></button>`).join('')}</div>`;
    pane.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>runGame(pane,b.dataset.g,lines,(score,total)=>{const s=P(n,i);if(score/total>=.8&&s.test<1){s.test=1;addStars(1);}save();return `<button class="block btn c-ghost" id="gback">اختبار آخر</button>`;},menu));};
  menu();
}
function runGame(pane,type,lines,onDone,back){
  let score=0,total=0;
  const finish=()=>{
    const extra=onDone(score,total);if(score===total)confetti();
    pane.innerHTML=`<div class="result"><div class="big">${score===total?'🌙':score/total>=.6?'⭐':'💪'}</div><h3>${score===total?'ما شاء الله! كلها صحيحة':score/total>=.6?'أحسنتِ! قريبة جدًا':'راجعي مرة أخرى ثم حاولي'}</h3>
      <p class="sub" style="font-size:20px">${ar(score)} من ${ar(total)} من أول محاولة</p><div class="row center">${extra}<button class="block btn c-mint" id="again">أعيدي</button></div></div>`;
    $('#again').onclick=()=>runGame(pane,type,lines,onDone,back);const gb=$('#gback');if(gb)gb.onclick=back;
  };
  if(type==='order'){
    const k=Math.min(lines.length,6);const start=Math.floor(Math.random()*(lines.length-k+1));
    const seq=lines.slice(start,start+k).map((l,x)=>({...l,k:x}));
    let order=shuffle(seq);if(k>1)while(order.every((x,j)=>x.k===j))order=shuffle(seq);
    let next=0,firstTry=true;total=k;
    pane.innerHTML=`<p class="gtitle">رتّبي ${ar(k)} ${k>2?'أسطر':'سطرين'}</p><div id="picked"></div><div class="opts" id="og">${order.map(l=>`<button class="opt" data-k="${l.k}">${l.t}</button>`).join('')}</div><div class="fb" id="fb"></div>`;
    pane.querySelectorAll('#og .opt').forEach(b=>b.onclick=()=>{const fb=$('#fb');
      if(+b.dataset.k===next){ok();if(firstTry)score++;firstTry=true;b.classList.add('used');$('#picked').insertAdjacentHTML('beforeend',`<div class="picked">${seq[next].t}${seq[next].last?' '+numMark(seq[next].a):''}</div>`);next++;fb.textContent='';
        if(next===k){fb.className='fb good';fb.textContent=PRAISE[Math.floor(Math.random()*PRAISE.length)];setTimeout(finish,900);}}
      else{no();firstTry=false;b.classList.remove('no');void b.offsetWidth;b.classList.add('no');fb.className='fb bad';fb.textContent='ليست هذه، فكّري: ماذا يأتي بعد؟';}});
    return;
  }
  const qs=[];
  if(type==='missing'){
    const pool=lines.flatMap(l=>l.t.split(' ')).filter(w=>bare(w).length>=3);
    shuffle(lines).slice(0,5).forEach(l=>{const ws=l.t.split(' ');const cand=ws.map((w,j)=>j).filter(j=>bare(ws[j]).length>=3);if(!cand.length)return;const j=cand[Math.floor(Math.random()*cand.length)];
      const wrong=shuffle([...new Set(pool.filter(w=>bare(w)!==bare(ws[j])))]).slice(0,2);if(wrong.length<2)return;
      qs.push({html:ws.map((w,x)=>x===j?`<span class="blank">${w}</span>`:w).join(' ')+(l.last?' '+numMark(l.a):''),right:ws[j],opts:shuffle([ws[j],...wrong]),words:true});});
  }else{
    shuffle(lines.slice(0,-1).map((_,k)=>k)).slice(0,5).forEach(k=>{const right=lines[k+1].t;
      const wrong=shuffle([...new Set(lines.filter((_,x)=>x!==k+1&&x!==k).map(l=>l.t))].filter(t=>t!==right)).slice(0,2);if(wrong.length<2)return;
      qs.push({html:lines[k].t+(lines[k].last?' '+numMark(lines[k].a):''),right,opts:shuffle([right,...wrong]),words:false});});
  }
  if(!qs.length){pane.innerHTML='<p class="sub">هذه المحطة قصيرة على هذا الاختبار، جرّبي اختبارًا آخر.</p><button class="block btn c-ghost" id="gb2">رجوع</button>';$('#gb2').onclick=back;return;}
  total=qs.length;let qi=0;
  const render=()=>{
    if(qi>=qs.length)return finish();
    const q=qs[qi];let first=true,locked=false;
    pane.innerHTML=`<p class="note" style="margin-top:10px">سؤال ${ar(qi+1)} من ${ar(qs.length)}</p><div class="mushaf"><div class="line">${q.html}</div></div>
      <p class="gtitle">${type==='missing'?'ما الكلمة الناقصة؟':'ماذا يأتي بعدها؟'}</p>
      <div class="opts ${q.words?'words':''}">${q.opts.map((o,x)=>`<button class="opt" data-x="${x}">${o}</button>`).join('')}</div><div class="fb" id="fb"></div>`;
    pane.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(locked)return;const fb=$('#fb');
      if(q.opts[+b.dataset.x]===q.right){locked=true;ok();b.classList.add('ok');if(first)score++;fb.className='fb good';fb.textContent=PRAISE[Math.floor(Math.random()*PRAISE.length)];
        const bl=pane.querySelector('.blank');if(bl)bl.style.color='var(--mint-d)';setTimeout(()=>{qi++;render();},1100);}
      else{no();first=false;b.classList.remove('no');void b.offsetWidth;b.classList.add('no');fb.className='fb bad';fb.textContent='حاولي مرة أخرى';}});
  };
  render();
}
function recitePane(pane,n,i,p,lines){
  const s=S.p[n+':'+i]||{};const last=i===stopsOf(n).length-1;
  pane.innerHTML=`<div class="panel" style="margin-top:12px"><p style="margin:0 0 6px;font-weight:800;color:#fff">هذا الجزء مع ماما أو بابا</p>
    <p class="note">تقرأ ابنتك المحطة من حفظها والنص مخفي. تابع معها، ثم اختر التقييم. «حفظتها جيدًا» تعني أنها قرأتها بلا أخطاء، أو بخطأ واحد صحّحته وحدها.</p></div>
   <div class="mushaf" style="text-align:center"><div class="basmala" style="font-size:calc(26px * var(--qs))">${QURAN[n][p.from-1].split(' ').slice(0,2).join(' ')} …</div><p class="note" style="color:var(--page-ink);margin:0">سورة ${INFO[n][0]} · ${rangeTxt(p)}</p></div>
   <div class="row center" style="margin-bottom:14px"><button class="block btn c-ghost" id="peek">إظهار النص للمتابعة</button></div><div id="txt" hidden>${mushaf(lines,p.from===1)}</div>
   <div class="rate">
     <button class="block btn c-mint" data-r="2">حفظتها جيدًا</button>
     <button class="block btn" data-r="1">أخطاء قليلة، نعيدها غدًا</button>
     <button class="block btn c-rose" data-r="0">تحتاج استماعًا أكثر</button>
   </div>
   ${s.date?`<p class="note" style="text-align:center;margin-top:12px">آخر تسميع: ${new Date(s.date).toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'})}</p>`:''}`;
  $('#peek').onclick=()=>{const t=$('#txt');t.hidden=!t.hidden;$('#peek').textContent=t.hidden?'إظهار النص للمتابعة':'إخفاء النص';};
  pane.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{
    const r=+b.dataset.r;const st=P(n,i);const was=mastered(n,i);st.recite=r;st.date=new Date().toISOString();save();
    if(r===2){if(!was){addStars(3);confetti();toast(last?'أتممتِ محطات السورة! جرّبي اختبار السورة كاملة':'أتممتِ المحطة! انتقلي للتالية');}else{addStars(1);toast('مراجعة ممتازة! ★');}setTimeout(()=>go('surah',n),1400);}
    else if(r===1){toast('لا بأس، المراجعة غدًا تثبّت الحفظ');go('portion',n,i,'hide');}
    else{toast('نستمع ونردّد مرة أخرى');go('portion',n,i,'listen');}
  });
}
screens.whole=function(n){
  header('اختبار سورة '+INFO[n][0],()=>go('surah',n));
  const all=stopsOf(n).flatMap(p=>linesOf(n,p));
  view.innerHTML=`<p class="sub">اختبار من كل السورة. اختاري نوع التحدي:</p><div id="pane"></div>`;
  const pane=$('#pane');
  const menu=()=>{pane.innerHTML=`<div style="display:grid;gap:12px">
    <button class="block btn c-ghost" style="justify-content:flex-start" data-g="next">ما الآية التالية؟</button>
    <button class="block btn c-ghost" style="justify-content:flex-start" data-g="missing">الكلمة الناقصة</button>
    <button class="block btn c-ghost" style="justify-content:flex-start" data-g="order">رتّبي الآيات</button></div>`;
    pane.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>runGame(pane,b.dataset.g,all,(sc,t)=>{if(sc===t){addStars(2);toast('نجمتان للسورة كاملة! ★★');}return `<button class="block btn c-ghost" id="gback">تحدٍّ آخر</button>`;},menu));};
  menu();
};

go('home');
})();
</script>
